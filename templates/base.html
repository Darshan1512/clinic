<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MediTrack{% endblock %} — Clinic Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css" />
  {% block head %}{% endblock %}
</head>
<body>
  {% if session.get('username') %}
  <nav class="nav">
    <a class="nav-brand" href="/dashboard">
      <span class="nav-icon">✦</span>
      MediTrack
    </a>
    <div class="nav-links">
      <a href="/dashboard" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/patients" class="nav-link {% if request.endpoint in ['patients_page','patient_detail'] %}active{% endif %}">Patients</a>
    </div>
    <div class="nav-right">
      <span class="nav-user">Dr. {{ session['username'] }}</span>
      <a href="/logout" class="btn-logout">Logout</a>
    </div>
  </nav>
  {% endif %}

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <div id="toast" class="toast"></div>
  <div id="modal-overlay" class="modal-overlay hidden"></div>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
